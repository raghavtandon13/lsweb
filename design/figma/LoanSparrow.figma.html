<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoanSparrow — Design File v1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0d3b3f;
      --navy-soft: #0a3033;
      --ink: #101618;
      --muted: #2c3538;
      --ivory: #f7f8f8;
      --paper: #fff;
      --line: #d9e0e0;
      --danger: #c24141;
      --gold: #e4b429;
      --gold-d: #c48a10;
      --mint: #1db8ae;
      --sky: #3b9ad9;
      --leaf: #2f9e6d;
      --coral: #e07a5f;
      --lilac: #7b6cf6;
      --shadow: 0 22px 50px -24px rgba(14, 61, 64, 0.28);
      --sans: Manrope, ui-sans-serif, system-ui, sans-serif;
      --serif: Fraunces, Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      grid-template-columns: 240px 1fr;
      font-family: var(--sans);
      color: var(--ink);
      background: #1e1e1e;
    }
    aside {
      background: #2c2c2c;
      color: #eee;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #111;
    }
    .brand {
      padding: 18px 16px 14px;
      border-bottom: 1px solid #3a3a3a;
    }
    .brand b { display: block; font-size: 13px; letter-spacing: .04em; }
    .brand span { font-size: 11px; color: #9a9a9a; }
    nav { padding: 10px 8px; overflow: auto; flex: 1; }
    nav button {
      display: block; width: 100%; text-align: left;
      background: none; border: 0; color: #cfcfcf;
      font: 600 12px/1.3 var(--sans); padding: 8px 10px; border-radius: 6px; cursor: pointer;
    }
    nav button:hover { background: #3a3a3a; color: #fff; }
    nav button.on { background: #0d3b3f; color: #fff; }
    .hint { padding: 12px 14px; font-size: 11px; color: #888; border-top: 1px solid #3a3a3a; line-height: 1.45; }
    main { overflow: auto; background: #e5e5e5; }
    .canvas { padding: 36px 40px 80px; min-width: 1100px; }
    .page-title { font: 600 13px var(--sans); color: #555; margin: 0 0 22px; letter-spacing: .12em; text-transform: uppercase; }
    .row { display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-start; }
    .frame { display: flex; flex-direction: column; gap: 8px; }
    .frame-name { font: 600 11px/1.2 var(--sans); color: #6a6a6a; }
    .art {
      background: var(--paper);
      border-radius: 4px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      overflow: hidden;
      position: relative;
    }
    .d { width: 1440px; transform: scale(.52); transform-origin: top left; height: 900px; }
    .wrap-d { width: calc(1440px * .52); height: calc(900px * .52); }
    .m { width: 390px; transform: scale(.72); transform-origin: top left; height: 844px; }
    .wrap-m { width: calc(390px * .72); height: calc(844px * .72); }
    .card-s { width: 420px; min-height: 320px; }
    .note {
      width: 200px; background: #fff4b0; padding: 12px 14px; font-size: 12px; line-height: 1.45;
      box-shadow: 2px 3px 0 rgba(0,0,0,.08); transform: rotate(-1.2deg);
    }
    .note b { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .swatch { width: 112px; }
    .swatch i { display: block; height: 72px; border-radius: 10px 10px 0 0; }
    .swatch p { margin: 0; padding: 8px; background: #fff; font-size: 11px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; }
    .type-row { background: #fff; padding: 16px 20px; border: 1px solid var(--line); border-radius: 12px; width: 520px; }
    .hdr, .ftr { display: flex; align-items: center; justify-content: space-between; }
    .hdr { height: 64px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #fff; }
    .logo { display: flex; align-items: center; gap: 8px; font-family: var(--serif); color: var(--navy); font-size: 18px; }
    .mark { width: 32px; height: 32px; border-radius: 10px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 11px; }
    .nav { display: flex; gap: 22px; font-size: 14px; font-weight: 600; color: var(--navy); }
    .btns { display: flex; gap: 8px; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; font-weight: 700; font-size: 12px; padding: 8px 14px; text-decoration: none; border: 0; cursor: default; }
    .btn-gold { background: var(--gold); color: #5c3d08; }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-out { background: #fff; color: var(--navy); border: 1px solid var(--line); }
    .btn-ghost { background: transparent; color: var(--navy); }
    .dot { width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--navy); }
    h1, h2, h3 { margin: 0; }
    .serif { font-family: var(--serif); color: var(--navy); }
    .cap { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-d); }
    .muted { color: var(--muted); }
    .pad { padding: 28px 40px; }
    .hero-bg { background: linear-gradient(90deg, var(--ivory), #fff, #fff8e8); min-height: 220px; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 500 14px var(--sans);
    }
    label.field { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; }
    .pill { display: inline-flex; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700; }
    .err { color: var(--danger); font-size: 13px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
    .strip { height: 4px; background: linear-gradient(90deg, var(--gold), var(--mint), var(--navy)); }
    .side { width: 240px; background: #fff; border-right: 1px solid var(--line); padding: 16px; }
    .dash { display: grid; grid-template-columns: 240px 1fr; height: 100%; background: var(--ivory); }
    .flow { display: flex; gap: 10px; align-items: center; font-size: 11px; font-weight: 700; color: #666; margin-bottom: 20px; }
    .flow span { background: #fff; border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; }
    .flow span.bad { background: #fff1ec; color: var(--coral); border-color: #f5c4b6; }
    .flow i { color: #aaa; font-style: normal; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 12px; background: var(--ivory); }
    td { padding: 12px; border-top: 1px solid var(--line); }
    .cover {
      width: 1440px; height: 900px; background: var(--navy); color: #fff; padding: 80px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .cover h1 { font-family: var(--serif); font-size: 72px; font-weight: 500; }
    .cover .gold { color: var(--gold); }
    .spec { font-size: 13px; line-height: 1.7; color: #c9d4d4; max-width: 520px; }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <b>LoanSparrow.fig</b>
      <span>UI kit · v1.0 · Sep 2026</span>
    </div>
    <nav id="pages"></nav>
    <div class="hint">Open this file in a browser. Import frames into Figma with html.to.design or copy artboards. Tokens live in tokens.json.</div>
  </aside>
  <main>
    <div class="canvas" id="canvas"></div>
  </main>
  <script>
    const pages = [
      ["cover", "00 Cover"],
      ["ia", "01 Sitemap & IA"],
      ["foundations", "02 Foundations"],
      ["components", "03 Components"],
      ["marketing", "04 Marketing · Desktop"],
      ["mobile", "05 Marketing · Mobile"],
      ["apply", "06 Apply funnel"],
      ["reject", "07 Outcomes & rejections"],
      ["login", "08 Login"],
      ["credit", "09 Credit"],
      ["help", "10 Help hub"],
      ["dash", "11 Dashboard"],
      ["partner", "12 Partners"],
      ["legal", "13 Legal & system"],
    ];

    const hdr = `
      <div class="hdr">
        <div class="logo"><span class="mark">LS</span> LoanSparrow</div>
        <div class="nav"><span>Loans ▾</span><span>Credit ▾</span><span>Partner with us</span><span>Help</span></div>
        <div class="btns">
          <span class="dot"></span>
          <span class="btn btn-gold">Check credit score</span>
          <span class="btn btn-out">Login</span>
          <span class="btn btn-navy">Apply now</span>
        </div>
      </div>`;

    function frame(name, inner, kind) {
      const cls = kind === "m" ? "m" : kind === "s" ? "" : "d";
      const wrap = kind === "m" ? "wrap-m" : kind === "s" ? "" : "wrap-d";
      const art = kind === "s" ? "art card-s" : `art ${cls}`;
      return `<div class="frame"><div class="frame-name">${name}</div><div class="${wrap}"><div class="${art}">${inner}</div></div></div>`;
    }

    function note(t, b) {
      return `<div class="note"><b>${t}</b>${b}</div>`;
    }

    const views = {
      cover() {
        return `
          <p class="page-title">Cover</p>
          <div class="row">
            ${frame("Cover / 1440×900", `
              <div class="cover">
                <div>
                  <div class="cap" style="color:var(--gold)">Marketplace · India</div>
                  <h1 style="margin-top:18px">LoanSparrow<br><span class="gold">UI design file</span></h1>
                  <p class="spec" style="margin-top:24px">Production-aligned artboards. Desktop 1440, mobile 390. 8px grid. Manrope + Fraunces. Navy #0D3B3F · Spark gold #E4B429.</p>
                </div>
                <div class="spec">v1.0 · 10 Sep 2026 · 40+ frames · apply 1–6 · no-offer · 404 · login OTP · dashboard empty/populated · help tabs · credit · partners · legal.</div>
              </div>`)}
            ${note("Handoff", "This file mirrors shipped UI. Do not invent a second visual language. Theme picker only shifts navy; gold coins stay #E4B429.")}
          </div>`;
      },

      ia() {
        const box = (t, items) => `
          <div class="art" style="width:220px;padding:16px">
            <div class="cap">${t}</div>
            <ul style="margin:10px 0 0;padding:0;list-style:none;font-size:12px;line-height:1.7;color:var(--muted)">
              ${items.map(i=>`<li>${i}</li>`).join("")}
            </ul>
          </div>`;
        return `
          <p class="page-title">Sitemap · information architecture</p>
          <div class="row">
            ${box("Marketing", ["Home /", "Loans /loans/:slug × 9", "Small ticket", "Credit score / report / health", "Credit cards", "EMI calculator", "Partner with us"])}
            ${box("Help hub", ["How it works  /help", "FAQs  /help/faqs", "Contact  /help/contact", "About  /help/about", "Redirects from old URLs"])}
            ${box("Apply funnel", ["1 Name + mobile", "2 OTP", "3 Details", "4 Consent", "5 Processing", "6 Offers  OR  No offer"])}
            ${box("Account", ["Login mobile → OTP", "Dashboard home", "Applications + timeline", "Offers", "Profile", "Support"])}
            ${box("Legal", ["Privacy", "Terms", "Disclaimer", "Grievance"])}
            ${box("System", ["404 not on the map", "Loan slug not found", "Auth wall → /login", "Empty dashboard lists"])}
            ${note("Nav order", "Loans → Credit → Partner with us → Help last. Header CTAs: Check credit score (gold) · Login · Apply now.")}
          </div>
          <div class="row" style="margin-top:36px">
            <div class="art" style="padding:20px;width:720px">
              <div class="cap">Happy path</div>
              <p style="margin:12px 0 0;font-size:13px;line-height:1.8">Home → Quick apply → OTP → Details → Consent → Processing → Offers → Continue with lender → Dashboard timeline.</p>
              <div class="cap" style="margin-top:18px">Rejection path</div>
              <p style="margin:12px 0 0;font-size:13px;line-height:1.8">Processing → No offer → Gold / Card against FD / Credit health. Never a dead end. Never red.</p>
            </div>
          </div>`;
      },

      foundations() {
        const colors = [
          ["Navy", "#0D3B3F", "#0d3b3f"],
          ["Ink", "#101618", "#101618"],
          ["Ivory", "#F7F8F8", "#f7f8f8"],
          ["Line", "#D9E0E0", "#d9e0e0"],
          ["Spark gold", "#E4B429", "#e4b429"],
          ["Mint", "#1DB8AE", "#1db8ae"],
          ["Sky", "#3B9AD9", "#3b9ad9"],
          ["Leaf", "#2F9E6D", "#2f9e6d"],
          ["Coral", "#E07A5F", "#e07a5f"],
          ["Danger", "#C24141", "#c24141"],
        ];
        return `
          <p class="page-title">Foundations</p>
          <div class="row">
            ${colors.map(([n,h,c]) => `<div class="swatch"><i style="background:${c}"></i><p><b>${n}</b><br>${h}</p></div>`).join("")}
          </div>
          <div class="row" style="margin-top:40px">
            <div class="type-row">
              <div class="cap">Type</div>
              <h1 class="serif" style="font-size:40px;margin-top:10px">Fraunces — headlines</h1>
              <p style="font-size:28px;font-weight:600;margin:8px 0 0;color:var(--navy)">Manrope — UI & body</p>
              <p class="muted" style="margin-top:10px">Body 16/1.55 · Caption 11px uppercase 0.16em · Buttons 12–15px semibold</p>
            </div>
            <div class="type-row">
              <div class="cap">Grid & radius</div>
              <p style="margin:10px 0 0">Base 8px. Frame padding 28–40. Cards 20px radius. Buttons 14px radius. Pills 999.</p>
              <p class="muted" style="margin-top:8px">Desktop zoom 80% in production (html zoom). Design at 1440 logical.</p>
            </div>
            ${note("Colour rule", "Brand navy is the theme. Spark gold is decorative and stays gold even when the theme changes. Use gold only for highlight CTAs and coins.")}
          </div>`;
      },

      components() {
        return `
          <p class="page-title">Components</p>
          <div class="row">
            <div class="art card-s" style="padding:24px">
              <div class="cap">Buttons</div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">
                <span class="btn btn-gold">Check credit score</span>
                <span class="btn btn-navy">Apply now</span>
                <span class="btn btn-out">Login</span>
                <span class="btn btn-ghost">Ghost</span>
              </div>
              <div class="cap" style="margin-top:22px">Status pills</div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
                <span class="pill" style="background:#e8f8ef;color:var(--leaf)">Offers ready</span>
                <span class="pill" style="background:#e7f4fc;color:var(--sky)">In review</span>
                <span class="pill" style="background:#fff8e4;color:var(--gold-d)">Disbursed</span>
                <span class="pill" style="background:#fff1ec;color:var(--coral)">No offer</span>
                <span class="pill" style="background:var(--ivory);color:var(--muted)">Closed</span>
              </div>
              <div class="cap" style="margin-top:22px">Field</div>
              <label class="field" style="margin-top:10px">Mobile</label>
              <input value="9876543210" />
              <p class="err" style="margin:6px 0 0">Enter a valid 10-digit Indian mobile.</p>
            </div>
            <div class="art card-s" style="padding:0;overflow:hidden">
              <div class="strip"></div>
              <div style="padding:20px">
                <div class="cap">Offer card</div>
                <p class="muted" style="margin:8px 0 0;font-size:13px">Aarohan Finance</p>
                <h2 class="serif" style="font-size:22px;margin-top:4px">Short Term PL</h2>
                <p style="margin:8px 0 0;font-weight:700;color:var(--gold)">₹80,000</p>
                <p class="muted" style="font-size:13px;margin:4px 0 0">EMI ₹7,346 · 18.5% p.a.</p>
                <span class="btn btn-navy" style="margin-top:16px;width:100%">Continue with lender</span>
              </div>
            </div>
            ${note("States required", "Every form: default, focus, error, disabled. Every list: loading, populated, empty. Every CTA: rest, hover (-1px), disabled 50%.")}
          </div>`;
      },

      marketing() {
        return `
          <p class="page-title">Marketing · Desktop</p>
          <div class="row">
            ${frame("Home / Hero", `
              ${hdr}
              <div class="hero-bg pad" style="display:grid;grid-template-columns:1.2fr .8fr;gap:40px;min-height:836px">
                <div>
                  <div class="cap">LoanSparrow</div>
                  <h1 style="font-size:48px;font-weight:600;color:var(--navy);margin-top:12px;max-width:520px">Fast-track your <span style="color:var(--gold)">loan approvals ...</span></h1>
                  <p class="muted" style="margin-top:16px;max-width:440px;font-size:18px">Personal, gold and business loans from partner NBFCs. Start with name and mobile — free to check.</p>
                  <div style="display:flex;gap:10px;margin-top:22px">
                    <span class="btn btn-navy" style="min-height:48px;padding:0 22px">View loans</span>
                    <span class="btn btn-out" style="min-height:48px;padding:0 22px">How it works</span>
                  </div>
                </div>
                <div class="card" style="padding:24px">
                  <div class="cap">Get your loan offer</div>
                  <h2 class="serif" style="font-size:28px;margin-top:8px">Start in 2 minutes</h2>
                  <label class="field" style="margin-top:18px">Name</label>
                  <input placeholder="Full name" />
                  <label class="field" style="margin-top:12px">Mobile</label>
                  <input placeholder="10-digit mobile" />
                  <p style="font-size:12px;margin:12px 0">☑ Terms, Privacy, Disclaimer</p>
                  <span class="btn btn-gold" style="width:100%;min-height:44px">Get OTP & continue</span>
                </div>
              </div>`)}
            ${note("Home", "Gold highlight only on “loan approvals”. Quick apply is the conversion unit. No eligibility math on this page.")}
          </div>
          <div class="row" style="margin-top:48px">
            ${frame("Loan product / Personal", `
              ${hdr}
              <div class="hero-bg pad" style="min-height:160px">
                <div class="cap">Planned expenses</div>
                <h1 class="serif" style="font-size:32px;margin-top:6px">Personal loan</h1>
                <p class="muted" style="margin-top:8px;max-width:560px">Compare offers from partner NBFCs. Amount, interest and fees before you continue.</p>
                <div style="display:flex;gap:8px;margin-top:14px">
                  <span class="btn btn-navy">Check eligibility</span>
                  <span class="btn btn-out">How it works</span>
                </div>
              </div>
              <div class="pad" style="display:grid;grid-template-columns:2fr 1fr;gap:24px;background:var(--ivory);min-height:620px">
                <div>
                  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
                    ${[["Amount","₹50K – ₹25L","var(--gold)"],["Tenure","12–60 mo","var(--mint)"],["Pricing","From 10.99%","var(--sky)"],["Disbursal","2–5 days","var(--coral)"]].map(([k,v,c])=>`<div class="card" style="padding:12px;box-shadow:none"><div class="muted" style="font-size:11px">${k}</div><div class="serif" style="color:${c};margin-top:4px">${v}</div></div>`).join("")}
                  </div>
                  <h2 class="serif" style="font-size:22px;margin:22px 0 10px">Why this product</h2>
                  <p class="muted" style="font-size:14px">No collateral. Named offers. Consent before bureau.</p>
                </div>
                <div class="card" style="padding:0;height:fit-content">
                  <div class="strip"></div>
                  <div style="padding:18px">
                    <div class="cap">Personal Loan</div>
                    <h2 class="serif" style="font-size:22px;margin-top:6px">Check eligibility</h2>
                    <p class="muted" style="font-size:13px;margin-top:8px">Borrow only what EMIs fit your income.</p>
                    <span class="btn btn-navy" style="width:100%;margin-top:14px">Check eligibility</span>
                  </div>
                </div>
              </div>`)}
          </div>`;
      },

      mobile() {
        const mhdr = `<div class="hdr" style="height:56px;padding:0 12px"><div class="logo" style="font-size:16px"><span class="mark" style="width:28px;height:28px">LS</span> LoanSparrow</div><div class="btns"><span class="dot"></span><span class="btn btn-out" style="width:36px;height:36px;border-radius:999px;padding:0">≡</span></div></div>`;
        return `
          <p class="page-title">Marketing · Mobile 390</p>
          <div class="row">
            ${frame("Home · mobile", `
              ${mhdr}
              <div class="pad" style="padding:20px;background:linear-gradient(#fff8e8,#fff);min-height:788px">
                <div class="cap">LoanSparrow</div>
                <h1 style="font-size:28px;font-weight:600;color:var(--navy);margin-top:10px">Fast-track your <span style="color:var(--gold)">loan approvals ...</span></h1>
                <span class="btn btn-navy" style="width:100%;margin-top:16px;min-height:44px">View loans</span>
                <span class="btn btn-out" style="width:100%;margin-top:8px;min-height:44px">How it works</span>
                <div class="card" style="margin-top:20px;padding:16px">
                  <div class="cap">Get your loan offer</div>
                  <h2 class="serif" style="font-size:22px;margin:8px 0 12px">Start in 2 minutes</h2>
                  <input placeholder="Name" />
                  <input placeholder="Mobile" style="margin-top:8px" />
                  <span class="btn btn-gold" style="width:100%;margin-top:12px">Get OTP</span>
                </div>
              </div>`, "m")}
            ${frame("Help tabs · mobile", `
              ${mhdr}
              <div class="hero-bg" style="padding:20px">
                <div class="cap">Help</div>
                <h1 class="serif" style="font-size:28px;margin-top:6px">FAQs</h1>
              </div>
              <div style="padding:16px;display:flex;flex-wrap:wrap;gap:8px">
                <span class="btn btn-out">How it works</span>
                <span class="btn btn-navy">FAQs</span>
                <span class="btn btn-out">Contact us</span>
                <span class="btn btn-out">About us</span>
              </div>
              <div style="padding:0 16px">
                <div class="card" style="padding:14px;box-shadow:none">Is LoanSparrow a bank?</div>
                <div class="card" style="padding:14px;box-shadow:none;margin-top:8px">Does checking eligibility affect CIBIL?</div>
              </div>`, "m")}
            ${note("Mobile header", "Hamburger only below xl. Credit score + Apply live in the sheet. Tabs are pills, never faint underlines.")}
          </div>`;
      },

      apply() {
        return `
          <p class="page-title">Apply funnel</p>

              </div>

                </div>
              </div>`)}
            ${note("Legal pages", "Same compact hero as Help. No Apply CTA on legal. Footer disclaimer always visible: we are not the lender.")}
            ${note("System", "sessionStorage apply · localStorage auth · theme hex · 80% desktop zoom · reduced-motion kills flight/coins.")}
          </div>`;
      },
    };

    const navEl = document.getElementById("pages");
    const canvas = document.getElementById("canvas");
    pages.forEach(([id, label], i) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = () => show(id);
      if (i === 0) b.classList.add("on");
      navEl.appendChild(b);
    });
    function show(id) {
      [...navEl.children].forEach((b, i) => b.classList.toggle("on", pages[i][0] === id));
      canvas.innerHTML = views[id]();
      canvas.parentElement.scrollTop = 0;
    }
    show("cover");
  </script>
